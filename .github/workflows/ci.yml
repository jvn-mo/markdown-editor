name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          Get-ChildItem src/js/*.js | ForEach-Object { node --check $_.FullName }

      - name: Package (no publish)
        run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
