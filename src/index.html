<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown 编辑器</title>
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <!-- Highlight.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"></script>
  <!-- Marked -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/lib/marked.umd.min.js"></script>
  <!-- 自定义样式 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶部工具栏 -->
  <div class="toolbar">
    <button id="toggle-editor" title="编辑栏全屏">编辑</button>
    <button id="toggle-preview" title="预览栏全屏">预览</button>
    <span class="toolbar-separator"></span>
    <span class="toolbar-info">Ctrl+O 打开 | Ctrl+S 保存 | Ctrl+Shift+P PDF | Ctrl+Shift+D DOCX</span>
    <span class="toolbar-version" id="toolbar-version"></span>
  </div>

  <!-- 标签栏 -->
  <div class="tab-bar" id="tab-bar">
    <div class="tab-list" id="tab-list"></div>
    <button class="tab-add" id="tab-add" title="新建文件">+</button>
  </div>

  <!-- 主内容区 -->
  <div class="main-container">
    <!-- 左侧编辑栏 -->
    <div class="editor-pane" id="editor-pane">
      <div class="pane-header">Markdown 源码</div>
      <textarea id="editor" placeholder="在此粘贴 Markdown 内容..." spellcheck="false"></textarea>
    </div>

    <!-- 分隔线 -->
    <div class="resizer" id="resizer"></div>

    <!-- 右侧预览栏 -->
    <div class="preview-pane" id="preview-pane">
      <div class="pane-header">实时预览</div>
      <div id="preview" class="preview-content"></div>
    </div>
  </div>

  <!-- 查找替换面板 -->
  <div class="find-replace-panel" id="find-replace-panel" style="display: none;">
    <div class="find-replace-row">
      <input type="text" id="find-input" placeholder="查找内容..." />
      <button id="find-next-btn">下一个</button>
      <button id="find-prev-btn">上一个</button>
    </div>
    <div class="find-replace-row" id="replace-row">
      <input type="text" id="replace-input" placeholder="替换为..." />
      <button id="replace-btn">替换</button>
      <button id="replace-all-btn">全部替换</button>
    </div>
    <button class="find-replace-close" id="find-replace-close">&#10005;</button>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar" id="status-bar">
    <span class="status-file" id="status-file">未命名</span>
    <span class="status-dirty" id="status-dirty"></span>
    <span class="status-msg" id="status-msg"></span>
    <span class="status-count" id="status-count">0 字</span>
  </div>

  <!-- 脚本 -->
  <script src="js/editor.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
